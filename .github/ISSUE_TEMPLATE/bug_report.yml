name: Bug report
description: Report a reproducible problem in the CLI or generated project
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the exact command and minimal steps to reproduce.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Generated language
      options:
        - TypeScript
        - JavaScript
        - Not applicable
    validations:
      required: true
